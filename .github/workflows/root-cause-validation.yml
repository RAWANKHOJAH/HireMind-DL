name: HireMind validation-only root-cause diagnosis
on:
  push:
    branches: [research/root-cause-diagnostic-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      HIREMIND_MAX_LEN: "512"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model and analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 numpy
      - name: Retrieve pinned original Hams code, public dataset split, checkpoint
        run: |
          git clone -q https://github.com/Hams770/Senior-2.git /tmp/Senior-2
          git -C /tmp/Senior-2 checkout -q cdab258a201141706d572ba03a4a7b9fb60708db
          git clone -q https://github.com/Hams770/HireMind-DL.git /tmp/HireMind-DL
          git -C /tmp/HireMind-DL checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
          git clone -q -b final-results --depth 1 https://github.com/Hams770/Senior-2.git /tmp/final-results
          cp /tmp/Senior-2/evaluation/knowledge/knowledge.py /tmp/Senior-2/evaluation/knowledge/knowledge_orig.py
          git fetch -q origin research/knowledge-quality-cpu-20261118
          git show FETCH_HEAD:research/knowledge_quality_overlay.py > /tmp/Senior-2/evaluation/knowledge/knowledge_quality_overlay.py
      - name: Diagnose actual missed Good Fit on frozen validation, no test access
        run: python -u research/audit_root_cause.py
      - name: Upload only privacy-screened aggregate diagnostics and hashed IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-evidence-validation-only
          path: root_audit_results/
          if-no-files-found: warn
          retention-days: 7
