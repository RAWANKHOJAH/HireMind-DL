name: HireMind ALL 4993 labels OOF + CPU retrain
on:
  push:
    branches:
      - research/all4993-oof-label-pilot-20261118
  workflow_dispatch:

permissions:
  contents: read
env:
  HIREMIND_MAX_LEN: "512"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  train_oof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fold: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verified CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 numpy
      - name: Check out original frozen training and dataset repos
        run: |
          git clone -q https://github.com/Hams770/Senior-2.git /tmp/Senior-2
          git -C /tmp/Senior-2 checkout -q cdab258a201141706d572ba03a4a7b9fb60708db
          git clone -q https://github.com/Hams770/HireMind-DL.git /tmp/HireMind-DL
          git -C /tmp/HireMind-DL checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - name: Train 3 epochs only on other 4 folds, predict heldout fold once
        run: |
          python -m py_compile research/train_oof_fold.py
          python -u research/train_oof_fold.py --fold ${{ matrix.fold }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all4993-oof-fold-${{ matrix.fold }}
          path: oof_fold/
          if-no-files-found: warn
          retention-days: 7

  aggregate_label_audit:
    needs: train_oof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Cleanlab label screening libraries (pinned)
        run: |
          python -m pip install cleanlab==2.7.1 numpy==1.26.4 pandas==2.2.3 scikit-learn==1.6.1
      - name: Fetch exact split manifest from original source
        run: |
          git clone -q https://github.com/Hams770/HireMind-DL.git /tmp/HireMind-DL
          git -C /tmp/HireMind-DL checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - uses: actions/download-artifact@v4
        with:
          pattern: all4993-oof-fold-*
          path: /tmp/oof_runs
      - name: Screen every single label, keep originals, write audit and guarded pseudo overlay
        run: |
          python -m py_compile research/merge_oof_label_audit.py
          python -u research/merge_oof_label_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all4993-label-audit
          path: audit_4993/
          if-no-files-found: warn
          retention-days: 7

  retrain_cpu:
    needs: aggregate_label_audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arm: [original, pseudo, weight]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.51.3 pandas==2.2.3 scikit-learn==1.6.1 huggingface-hub==0.30.2 numpy
      - name: Fetch pinned original training sources
        run: |
          git clone -q https://github.com/Hams770/Senior-2.git /tmp/Senior-2
          git -C /tmp/Senior-2 checkout -q cdab258a201141706d572ba03a4a7b9fb60708db
          git clone -q https://github.com/Hams770/HireMind-DL.git /tmp/HireMind-DL
          git -C /tmp/HireMind-DL checkout -q 1f22f34462c400f884bb0a00f061dbea0bd687d5
      - uses: actions/download-artifact@v4
        with:
          name: all4993-label-audit
          path: /tmp/label_audit
      - name: Retrain real BERT-Tiny on all 4993 with single controlled label strategy
        run: |
          python -m py_compile research/train_label_arm.py
          python -u research/train_label_arm.py --arm ${{ matrix.arm }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all4993-label-pilot-${{ matrix.arm }}
          path: model_results/
          if-no-files-found: warn
          retention-days: 7

  verify_all_results:
    needs: retrain_cpu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==1.26.4 pandas==2.2.3 scikit-learn==1.6.1
      - uses: actions/download-artifact@v4
        with:
          name: all4993-label-audit
          path: /tmp/label_audit
      - uses: actions/download-artifact@v4
        with:
          pattern: all4993-label-pilot-*
          path: /tmp/model_runs
      - name: Verify all 3 checkpoints, 1162 row IDs, and independent metrics
        run: python -u research/verify_label_cleaning.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all4993-final-label-cleaning-result
          path: final_label_cleaning_report/
          if-no-files-found: warn
          retention-days: 7
